name: Publish to O2Switch

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    name: Build & Deploy project
    steps:
      - name: git-checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SSR app
        run: npm run build

      # Passenger (O2Switch) redémarre l'app quand tmp/restart.txt change.
      - name: Trigger app restart
        run: mkdir -p .output/tmp && date > .output/tmp/restart.txt

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: ./.output/
          server-dir: ${{ secrets.ftp_server_dir || './' }}